name: PR Gate

on:
  pull_request:
    branches: [main, master]

concurrency:
  group: pr-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit --ci

      - name: Build Docusaurus
        working-directory: docs
        run: pnpm build

      - name: Build Storybook
        run: pnpm build-storybook --config-dir .storybook --output-dir storybook-static

      - name: Verify Storybook output is non-empty
        run: test -n "$(ls -A storybook-static)"
