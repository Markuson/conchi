buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        // Story 2.1 (FCM spike): reads android/app/google-services.json (gitignored,
        // developer-supplied) and generates the resources expo-notifications' native
        // Firebase Messaging wiring needs. Bare-workflow direct linking — no Expo
        // config plugin runs this for us, since app.json stays minimal (AD-3).
        classpath("com.google.gms:google-services:4.5.0")
    }
}

apply plugin: "com.facebook.react.rootproject"
