services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: conchi-minio
    restart: unless-stopped
    command: server /data --console-address ":${MINIO_CONSOLE_PORT:-9001}"
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:${MINIO_CONSOLE_PORT:-9001}'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-changeme-not-a-real-user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme-not-a-real-password}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  minio-data:
